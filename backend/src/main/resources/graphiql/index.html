<!doctype html>
<!--
  Replaces the GraphiQL page bundled in spring-graphql 1.3, which loads *unversioned* scripts from unpkg and broke
  when GraphiQL 4/5 dropped its UMD builds. Same location (classpath:graphiql/index.html), pinned versions.
  Served at /graphiql only when API_DOCS_ENABLED=true.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VirtualFriends · GraphiQL</title>
  <link rel="stylesheet" href="https://unpkg.com/graphiql@3.7.1/graphiql.min.css">
  <link rel="stylesheet" href="https://unpkg.com/@graphiql/plugin-explorer@3.2.3/dist/style.css">
  <style>body { margin: 0; height: 100vh; } #graphiql { height: 100vh; }</style>
</head>
<body>
<div id="graphiql">Loading…</div>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/graphiql@3.7.1/graphiql.min.js"></script>
<script crossorigin src="https://unpkg.com/@graphiql/plugin-explorer@3.2.3/dist/index.umd.js"></script>
<script>
  const path = new URLSearchParams(location.search).get('path') || '/graphql';
  const fetcher = GraphiQL.createFetcher({ url: new URL(path, location.href).href });
  const defaultQuery = `# Paste an access token into Headers below (POST /api/auth/login returns it as "token").
query MyChats {
  me { username role }
  conversations {
    id type title unread
    lastMessage { content createdAt sender { displayName } }
  }
}
`;
  ReactDOM.createRoot(document.getElementById('graphiql')).render(React.createElement(GraphiQL, {
    fetcher,
    plugins: [GraphiQLPluginExplorer.explorerPlugin()],
    defaultQuery,
    defaultEditorToolsVisibility: 'headers',
    defaultHeaders: JSON.stringify({ Authorization: 'Bearer <access token>' }, null, 2),
    shouldPersistHeaders: false, // never store tokens in localStorage
  }));
</script>
</body>
</html>
