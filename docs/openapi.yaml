components:
  schemas:
    BotRequest:
      required:
      - name
      - persona
      type: object
      properties:
        name:
          type: string
        persona:
          type: string
        language:
          pattern: vi|en|zh|ja|ko|es|ru
          type: string
        ttsProvider:
          type: string
          enum:
          - BROWSER
          - ELEVENLABS
          - COEIROINK
          - GOOGLE
        voiceId:
          type: string
        avatarModelId:
          type: string
          format: uuid
        model:
          maxLength: 64
          minLength: 0
          type: string
    AvatarDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        format:
          type: string
          enum:
          - PLACEHOLDER
          - GLTF
          - VRM
          - LIVE2D
          - UNITY
        url:
          type: string
        builtIn:
          type: boolean
    BotDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        persona:
          type: string
        language:
          type: string
        ttsProvider:
          type: string
          enum:
          - BROWSER
          - ELEVENLABS
          - COEIROINK
          - GOOGLE
        voiceId:
          type: string
        avatar:
          $ref: "#/components/schemas/AvatarDto"
        model:
          type: string
    UploadResponse:
      type: object
      properties:
        url:
          type: string
        mimeType:
          type: string
        size:
          type: integer
          format: int64
    TtsRequest:
      required:
      - text
      type: object
      properties:
        text:
          maxLength: 2000
          minLength: 0
          type: string
        language:
          type: string
        provider:
          type: string
          enum:
          - BROWSER
          - ELEVENLABS
          - COEIROINK
          - GOOGLE
        voiceId:
          type: string
    StickerPackRequest:
      required:
      - name
      type: object
      properties:
        name:
          maxLength: 80
          minLength: 0
          type: string
    StickerDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        packId:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
        mimeType:
          type: string
    StickerPackDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        stickers:
          type: array
          items:
            $ref: "#/components/schemas/StickerDto"
    StickerRequest:
      required:
      - mimeType
      - name
      - url
      type: object
      properties:
        name:
          type: string
        url:
          type: string
        mimeType:
          type: string
    MessageDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
        fromBot:
          type: boolean
        type:
          type: string
          enum:
          - TEXT
          - STICKER
          - IMAGE
          - FILE
          - AUDIO
          - SYSTEM
        content:
          type: string
        sticker:
          $ref: "#/components/schemas/StickerDto"
        attachmentUrl:
          type: string
        replyToId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: string
          format: date-time
        recalled:
          type: boolean
        reactions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              format: uuid
    ReactionRequest:
      required:
      - emoji
      type: object
      properties:
        emoji:
          maxLength: 16
          minLength: 0
          type: string
    CreateConversationRequest:
      type: object
      properties:
        type:
          type: string
          enum:
          - DIRECT
          - GROUP
          - BOT
        userIds:
          type: array
          items:
            type: string
            format: uuid
        title:
          type: string
        botId:
          type: string
          format: uuid
    ConversationDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - DIRECT
          - GROUP
          - BOT
        title:
          type: string
        bot:
          $ref: "#/components/schemas/BotDto"
        members:
          type: array
          items:
            $ref: "#/components/schemas/UserDto"
        lastMessage:
          $ref: "#/components/schemas/MessageDto"
        unread:
          type: integer
          format: int64
        pinned:
          type: boolean
        muted:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        readBy:
          type: object
          additionalProperties:
            type: string
            format: date-time
    UserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
        theme:
          type: string
        lastSeenAt:
          type: string
          format: date-time
    SendMessageRequest:
      type: object
      properties:
        type:
          type: string
          enum:
          - TEXT
          - STICKER
          - IMAGE
          - FILE
          - AUDIO
          - SYSTEM
        content:
          maxLength: 8000
          minLength: 0
          type: string
        stickerId:
          type: string
          format: uuid
        attachmentUrl:
          type: string
        replyToId:
          type: string
          format: uuid
    AvatarRequest:
      required:
      - name
      - url
      type: object
      properties:
        name:
          type: string
        format:
          type: string
          enum:
          - PLACEHOLDER
          - GLTF
          - VRM
          - LIVE2D
          - UNITY
        url:
          type: string
    RegisterRequest:
      required:
      - displayName
      - password
      - username
      type: object
      properties:
        username:
          maxLength: 40
          minLength: 3
          pattern: "[a-zA-Z0-9_.]*"
          type: string
        displayName:
          maxLength: 80
          minLength: 0
          type: string
        password:
          maxLength: 100
          minLength: 8
          type: string
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        expiresIn:
          type: integer
          format: int64
        user:
          $ref: "#/components/schemas/MeDto"
    MeDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
        theme:
          type: string
        role:
          type: string
    LoginRequest:
      required:
      - password
      - username
      type: object
      properties:
        username:
          type: string
        password:
          type: string
    AdminUserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
