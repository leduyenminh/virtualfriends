openapi: 3.0.1
info:
  title: VirtualFriends API
  description: |-
    REST API of the VirtualFriends chat app. A GraphQL API with the same data is at `/graphql` (explore it at `/graphiql`); realtime events use STOMP over the `/ws` WebSocket.

    **Authentication.** `POST /api/auth/login` (or `/register`) returns a 15-minute access token in the body and sets a rotating refresh token as an httpOnly cookie. Send the access token as `Authorization: Bearer <token>`; when it expires call `POST /api/auth/refresh` (the browser sends the cookie). In Swagger UI: log in, copy `token`, click **Authorize**.

    **Errors** are JSON `{"error": "human-readable message"}` with the usual HTTP status codes.
  license:
    name: Private
  version: "1.0"
externalDocs:
  description: README
  url: https://github.com/leduyenminh/virtualfriends
servers:
- url: http://localhost:8081
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: Auth
  description: "Sign-in, sessions, social login providers"
- name: Users
  description: "Profile, search, presence"
- name: Conversations
  description: "Chats, messages, reactions, read state"
- name: Bots & avatars
  description: "AI friends, Claude models, 3D/Live2D avatar models"
- name: Stickers
  description: Sticker packs
- name: Media
  description: Uploads and text-to-speech
- name: Admin
  description: Moderation (ADMIN role)
paths:
  /api/bots/{id}:
