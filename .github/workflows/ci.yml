name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B -f backend/pom.xml verify
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend

  # Container images for any host: ghcr.io/<owner>/vchat-backend and vchat-web, tagged latest + commit sha,
  # for amd64 and arm64 (e.g. Oracle Cloud's free Ampere VMs). Deploy them with deploy/docker-compose.yml, deploy/k8s,
  # or any platform that runs containers.
  images:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: backend, context: backend }
          - { name: web, context: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vchat-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}:latest
            ${{ steps.image.outputs.ref }}:${{ github.sha }}
          # Public client ids for cloud sticker import (repository variables; only the web image uses them)
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
            VITE_GOOGLE_API_KEY=${{ vars.VITE_GOOGLE_API_KEY }}
            VITE_ONEDRIVE_CLIENT_ID=${{ vars.VITE_ONEDRIVE_CLIENT_ID }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Optional: set the DEPLOY_HOOK_URL secret to a URL your host calls to pull the new images and redeploy
  # (deploy hooks of Render, Coolify, Dokploy, CapRover, Portainer, ...). Skipped when it isn't set.
  deploy:
    needs: images
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
    steps:
      - if: env.DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$DEPLOY_HOOK_URL"
