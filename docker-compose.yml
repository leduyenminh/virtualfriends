# Local infrastructure. Typical dev loop: start db + redis here, run the backend with Maven and the frontend with npm.
#   docker compose up -d db redis                  (required)
#   docker compose --profile kafka up -d kafka     (optional, for VCHAT_EVENTS=kafka)
#   docker compose --profile app up -d --build     (optional: also run the backend in a container)
# COEIROINK (Japanese voices) has no official container: install the desktop engine (https://coeiroink.com) and
# start it; the backend probes http://localhost:50032.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vchat
      POSTGRES_USER: vchat
      POSTGRES_PASSWORD: vchat
    # Query diagnostics: pg_stat_statements aggregates every query's calls/time; the slow-query log prints any
    # statement over 200 ms; auto_explain logs the actual plan of statements over 500 ms.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements,auto_explain
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_min_duration_statement=200
      - -c
      - auto_explain.log_min_duration=500
      - -c
      - auto_explain.log_analyze=on
      - -c
      - track_io_timing=on
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]

  redis:
    image: redis:7.4-alpine
    # Cache only: evict least-recently-used keys when full instead of erroring
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports: ["6379:6379"]

  kafka:
    profiles: ["kafka"]
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  backend:
    profiles: ["app"]
    build: ./backend
    depends_on: [db, redis]
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/vchat
      DB_USER: vchat
      DB_PASSWORD: vchat
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:29092
      CORS_ORIGINS: http://localhost:5173
      STORAGE_MODE: LOCAL
      MEDIA_BASE_URL: http://localhost:5173/files
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      GOOGLE_TTS_API_KEY: ${GOOGLE_TTS_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      COEIROINK_URL: http://host.docker.internal:50032
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-local-dev-secret-0123456789}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [uploads:/app/uploads]

volumes:
  dbdata:
  uploads:
